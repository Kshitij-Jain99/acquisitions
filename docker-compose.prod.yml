version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    container_name: acquisitions-app-prod

    ports:
      - "${PORT:-3000}:3000"

    env_file:
      - .env.production

    volumes:
      - ./logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
